<!DOCTYPE html>
<head>
    <br>
    <h1> Ficha De Ingreso De Estudiantes-Ano 2026 </h1>
    <br>
    <br>
    <li> Datos Del Estudiante </li>
    <br>
    <form>
        <li><label> Nombres  : </label></li>
        <input type="nombre">
        <li><label> Apellidos: </label></li>
        <input type="apellido">
        <li><label> RUN: </label></li>
        <input type="rut">
        <li><label> Fecha De Nacimiento </label></li>
        <input type="fecha de nacimiento">
        <li><label> Nacionalidad </label></li>
        <input type="nacionalidad">
        <fieldset style="border: 1px solid #777; padding: 10px; width: 150px; font-family: Arial, sans-serid;">
            <legend style="font-size: 12px; ">Género:</legend>
            <label style="font-size: 14px; display: block; margin-bottom: 5px;">
                <input type="radio" name="genero" value="Masculino"> Masculino
            </label>

            <label style="font-size: 14px; display: block;">
                <input type="radio" name="genero" value="Femenino"> Femenino
            </label>
        </fieldset>
        <li><label> Direccion Actual </label></li>
        <input type="direccion">
        <li><label> Comuna </label></li>
        <input type="comuna">
        <li><label> Telefono Estudiante </label></li>
        <input type="telefono">
    </form>
</head>
<body bgcolor="YELLOW"></body>
<footer>
    <fieldset style="border: 1px solid #777; padding: 10px; width: 150px; font-family: Arial, sans-serid;">
            <legend style="font-size: 12px; ">Pertenece a programa PIE?:</legend>
            <label style="font-size: 14px; display: block; margin-bottom: 5px;">
                <input type="radio" name="PIE" value="SI"> Si
            </label>
            <label style="font-size: 14px; display: block; margin-bottom: 5px;">
                <input type="radio" name="PIE" value="No"> No
            </label>
</footer>
